[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra --strict-markers --import-mode=importlib
markers =
    live: requires the real ComfyUI install (C:\ComfyUI) and/or an indexed vault.db; excluded by default
    perf: performance budget assertion; timing-sensitive, excluded by default
    slow: takes more than ~10 s
    contract: API_CONTRACT.md conformance
    mcp: MCP_SPEC.md conformance
filterwarnings =
    ignore::DeprecationWarning
