[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra --strict-markers --import-mode=importlib
# The shared `temp_vault` fixture writes a real ~76 MB model file per test.
# pytest's default keeps the temp dirs of the last three runs, which for this
# suite is tens of gigabytes; keep only what a failing test left behind.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
markers =
    live: requires the real ComfyUI install (C:\ComfyUI) and/or an indexed vault.db; excluded by default
    perf: performance budget assertion; timing-sensitive, excluded by default
    slow: takes more than ~10 s
    contract: API_CONTRACT.md conformance
    mcp: MCP_SPEC.md conformance
    windows_paths: asserts Windows path semantics (drive letters, backslashes, long-path prefixes); skipped on other platforms
filterwarnings =
    ignore::DeprecationWarning
